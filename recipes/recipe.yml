---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: tangle
description: GNU/Linux Tangle OS - districando complessità con potenza atomica


base-image: ghcr.io/ublue-os/base-main
image-version: latest


modules:
  - type: files
    files:
      - source: system
        destination:

  - type: dnf
  repos:
    copr:
      - ashbuk/Hyprland-Fedora
  install:
    packages:
      - hyprland
      - xdg-desktop-portal-hyprland
      - kitty
      - git

  - type: signing
